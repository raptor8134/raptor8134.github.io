<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:16px}.g{display:flex;gap:0}.sw{flex:1;height:64px;display:flex;align-items:flex-end;padding:6px;font-family:var(--font-mono);font-size:9px;letter-spacing:.08em}.stack{display:flex;flex-direction:column;gap:10px}.rowx{display:flex;gap:14px;align-items:center;flex-wrap:wrap}.t{font-family:var(--font-mono);font-size:var(--size-2xs);letter-spacing:var(--track-caps);text-transform:uppercase;color:var(--text-faint)}</style></head><body><div class="g"><div class="sw" style="background:var(--signal-ok);color:#05080B">ok #2BE08A</div><div class="sw" style="background:var(--signal-info);color:#05080B">info #22D3EE</div><div class="sw" style="background:var(--signal-warn);color:#05080B">warn #F0C05A</div><div class="sw" style="background:var(--signal-fail);color:#05080B">fail #FF6B5E</div></div><div class="t" style="margin-top:8px">pass / note / caution / failure</div></body></html>
