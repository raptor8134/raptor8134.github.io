<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:16px}.g{display:flex;gap:0}.sw{flex:1;height:64px;display:flex;align-items:flex-end;padding:6px;font-family:var(--font-mono);font-size:9px;letter-spacing:.08em}.stack{display:flex;flex-direction:column;gap:10px}.rowx{display:flex;gap:14px;align-items:center;flex-wrap:wrap}.t{font-family:var(--font-mono);font-size:var(--size-2xs);letter-spacing:var(--track-caps);text-transform:uppercase;color:var(--text-faint)}@keyframes ds-sweep{from{width:8%}to{width:100%}}</style></head><body><div class="stack" style="gap:10px">
<div style="display:flex;align-items:center;gap:12px"><span class="t" style="min-width:100px">dur-1 80ms</span><span style="flex:1;height:4px;background:var(--bg-inset);border:var(--border-hairline);overflow:hidden"><span style="display:block;height:100%;background:var(--grad-accent);animation:ds-sweep 80ms var(--ease-term) infinite alternate"></span></span></div><div style="display:flex;align-items:center;gap:12px"><span class="t" style="min-width:100px">dur-2 140ms</span><span style="flex:1;height:4px;background:var(--bg-inset);border:var(--border-hairline);overflow:hidden"><span style="display:block;height:100%;background:var(--grad-accent);animation:ds-sweep 140ms var(--ease-term) infinite alternate"></span></span></div><div style="display:flex;align-items:center;gap:12px"><span class="t" style="min-width:100px">dur-3 240ms</span><span style="flex:1;height:4px;background:var(--bg-inset);border:var(--border-hairline);overflow:hidden"><span style="display:block;height:100%;background:var(--grad-accent);animation:ds-sweep 240ms var(--ease-term) infinite alternate"></span></span></div><div style="display:flex;align-items:center;gap:12px"><span class="t" style="min-width:100px">dur-4 420ms</span><span style="flex:1;height:4px;background:var(--bg-inset);border:var(--border-hairline);overflow:hidden"><span style="display:block;height:100%;background:var(--grad-accent);animation:ds-sweep 420ms var(--ease-term) infinite alternate"></span></span></div>
<div class="t">cubic-bezier(.2,.8,.2,1) · no bounce, no spring, no parallax</div></div></body></html>
