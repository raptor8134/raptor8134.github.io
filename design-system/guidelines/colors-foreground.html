<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:16px;background:var(--ink-900)}.g{display:flex;gap:0}.sw{flex:1;height:64px;display:flex;align-items:flex-end;padding:6px;font-family:var(--font-mono);font-size:9px;letter-spacing:.08em}.stack{display:flex;flex-direction:column;gap:10px}.rowx{display:flex;gap:14px;align-items:center;flex-wrap:wrap}.t{font-family:var(--font-mono);font-size:var(--size-2xs);letter-spacing:var(--track-caps);text-transform:uppercase;color:var(--text-faint)}</style></head><body><div class="g"><div class="sw" style="background:#EDEDED;color:#121212">fg-1 #EDEDED</div><div class="sw" style="background:#A8AFAF;color:#121212">fg-2 #A8AFAF</div><div class="sw" style="background:#757C7C;color:#121212">fg-3 #757C7C</div><div class="sw" style="background:#525858;color:#EDEDED">fg-4 #525858</div></div><div class="t" style="margin-top:8px">strong · body · muted · faint</div></body></html>
