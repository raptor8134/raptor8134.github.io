<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:16px;background:var(--ink-900)}.g{display:flex;gap:0}.sw{flex:1;height:64px;display:flex;align-items:flex-end;padding:6px;font-family:var(--font-mono);font-size:9px;letter-spacing:.08em}.stack{display:flex;flex-direction:column;gap:10px}.rowx{display:flex;gap:14px;align-items:center;flex-wrap:wrap}.t{font-family:var(--font-mono);font-size:var(--size-2xs);letter-spacing:var(--track-caps);text-transform:uppercase;color:var(--text-faint)}</style></head><body><div class="rowx" style="align-items:stretch">
<div style="flex:1;height:100px;position:relative;background:var(--ink-1000);background-image:var(--grid-overlay);border:var(--border-hairline)"><div style="position:absolute;inset:0;background:var(--bg-scrim);backdrop-filter:blur(var(--blur-backdrop));display:flex;align-items:flex-end;padding:8px" class="t">scrim + 6px blur</div></div>
<div style="flex:1;height:100px;background:var(--bg-inset);background-image:var(--scanline);border:var(--border-hairline);display:flex;align-items:flex-end;padding:8px" class="t">scanline</div>
<div style="flex:1;height:100px;background:var(--grad-accent-soft);border:var(--border-hairline);display:flex;align-items:flex-end;padding:8px" class="t">grad-accent-soft</div></div></body></html>
