/* --- Theme switch: flip the palette in one step ---------------------------- *
 * The design-system controls each carry a ~140ms colour/border transition for
 * hover and focus. When [data-theme] flips they all fire at once while plain
 * text and the page background snap instantly, so the swap reads as a slow,
 * staggered wipe. App.jsx sets [data-theme-animating] on <html> for two frames
 * around the toggle; this makes the change instant.                          */
html[data-theme-animating] *,
html[data-theme-animating] *::before,
html[data-theme-animating] *::after {
  transition: none !important;
}

/* Figure captions: keep the "FIG N" label on one line (build also joins it
 * with a non-breaking space). */
figcaption > span:first-child {
  white-space: nowrap;
}

/* Project cards in light mode: the hairline border on white is nearly
 * invisible. The border is an inline `var(--border-hairline)`, and the token
 * bakes in --line-1 at :root, so it can't be nudged by redefining --line-1 on
 * the card — override the colour directly. Keep the accent border on hover. */
[data-theme="paper"] .pf-card {
  border-color: var(--line-2) !important;
}
[data-theme="paper"] .pf-card:hover {
  border-color: var(--line-accent) !important;
}

/* Tooltip in light mode: the component's background is a fixed dark ink, but
 * the paper theme flips its text to --text-strong (near-black too), so the
 * label reads as a solid black box. Keep the tooltip dark and give it a light
 * label and a defined edge. */
[data-theme="paper"] [role="tooltip"] {
  color: var(--fg-1) !important;
  border-color: var(--ink-600) !important;
}

/* Light mode contrast: the design-system paper palette leaves the green
 * accents below WCAG AA on white — links (--text-accent #0B8F6B) at ~4.0:1,
 * FIG labels and article list numbers (--accent-spring #12A870) at ~3.0:1.
 * Darken both to ~5:1. The hero highlight uses a hard-coded #2BE08A and is
 * unaffected; --line-accent / --selection-bg are literal in the paper scope.
 * These greens are the revert target for the blue swap below. */
[data-theme="paper"] {
  --text-accent:   #097B5A;
  --accent-spring: #0C7A5A;
}

/* --- Light mode: green accents -> blue ----------------------------------- *
 * Delete this whole block (keep the file) to go back to the green accents
 * above. Dark mode is untouched. #1B4FD1 on white is ~6.6:1 (AA). The header
 * style switch keeps its own green->blue gradient via .style-switch below.  */
[data-theme="paper"] {
  --text-accent:        #1B4FD1;
  --accent-spring:      #1B4FD1;
  --line-accent:        rgba(27, 79, 209, .5);
  --selection-bg:       rgba(27, 79, 209, .18);
  --grad-accent:        #1B4FD1;
  --grad-accent-smooth: #1B4FD1;
  --grad-accent-diag:   #1B4FD1;
  --grad-accent-soft:   rgba(27, 79, 209, .14);
}

/* --- TEMPORARY: flatten the accent gradient to solid spring-green --------- *
 * Delete this block (leave the file) to restore the green -> blue gradient.
 * The header style switch keeps the real gradient via .style-switch below.   */
:root {
  --grad-accent:        var(--accent-spring);
  --grad-accent-smooth: var(--accent-spring);
  --grad-accent-diag:   var(--accent-spring);
  --grad-accent-soft:   color-mix(in srgb, var(--accent-spring) 15%, transparent);
}
/* The style switch keeps the real green -> blue gradient in every theme, so
 * its colours are literal — the light-mode blue remap would otherwise flatten
 * it to blue -> blue. */
.style-switch {
  --grad-accent: linear-gradient(90deg, #2BE08A 0%, #1B4FD1 100%);
}
